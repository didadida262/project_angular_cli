<div class="settings-container">
  <header class="settings-header">
    <h1>⚙️ 设置</h1>
    <p>配置你的应用偏好设置</p>
  </header>

  <div class="settings-content">
    <!-- 主题设置 -->
    <section class="setting-section">
      <h2>🎨 外观</h2>
      <div class="setting-item">
        <div class="setting-info">
          <h3>暗黑模式</h3>
          <p>切换到暗黑主题，保护你的眼睛</p>
        </div>
        <label class="toggle">
          <input 
            type="checkbox" 
            [checked]="isDarkMode()"
            (change)="toggleDarkMode()"
          >
          <span class="toggle-slider"></span>
        </label>
      </div>
    </section>

    <!-- 语言设置 -->
    <section class="setting-section">
      <h2>🌍 语言</h2>
      <div class="setting-item">
        <div class="setting-info">
          <h3>界面语言</h3>
          <p>选择你偏好的界面语言</p>
        </div>
        <select 
          class="language-select"
          [value]="currentLanguage()"
          (change)="changeLanguage($any($event.target).value)"
        >
          @for (lang of languages; track lang.code) {
            <option [value]="lang.code">{{ lang.name }}</option>
          }
        </select>
      </div>
    </section>

    <!-- 通知设置 -->
    <section class="setting-section">
      <h2>🔔 通知</h2>
      <div class="setting-item">
        <div class="setting-info">
          <h3>邮件通知</h3>
          <p>接收重要的邮件通知</p>
        </div>
        <label class="toggle">
          <input 
            type="checkbox" 
            [checked]="notifications().email"
            (change)="updateNotification('email', $any($event.target).checked)"
          >
          <span class="toggle-slider"></span>
        </label>
      </div>
      
      <div class="setting-item">
        <div class="setting-info">
          <h3>推送通知</h3>
          <p>接收浏览器推送通知</p>
        </div>
        <label class="toggle">
          <input 
            type="checkbox" 
            [checked]="notifications().push"
            (change)="updateNotification('push', $any($event.target).checked)"
          >
          <span class="toggle-slider"></span>
        </label>
      </div>
      
      <div class="setting-item">
        <div class="setting-info">
          <h3>短信通知</h3>
          <p>接收短信通知</p>
        </div>
        <label class="toggle">
          <input 
            type="checkbox" 
            [checked]="notifications().sms"
            (change)="updateNotification('sms', $any($event.target).checked)"
          >
          <span class="toggle-slider"></span>
        </label>
      </div>
    </section>

    <!-- 操作按钮 -->
    <div class="actions">
      <button class="btn btn-primary" (click)="saveSettings()">
        💾 保存设置
      </button>
      <button class="btn btn-secondary" (click)="resetSettings()">
        🔄 重置设置
      </button>
    </div>
  </div>
</div>
